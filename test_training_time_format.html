<!DOCTYPE html>
<html>
<head>
    <title>Test Training Time Formatting</title>
</head>
<body>
    <h1>Test Training Time Formatting</h1>
    <div id="results"></div>

<script>
// Copie des fonctions de formatage depuis React
const formatDuration = (duration) => {
    if (!duration || duration === 0) return 'N/A';
    
    // Conversion en nombre si c'est une chaîne
    const time = typeof duration === 'string' ? parseFloat(duration) : duration;
    if (isNaN(time) || time === 0) return 'N/A';
    
    // Formatage selon la durée
    if (time < 60) {
        return `${time.toFixed(1)}s`;
    } else if (time < 3600) {
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        return seconds > 0 ? `${minutes}m ${seconds}s` : `${minutes}m`;
    } else {
        const hours = Math.floor(time / 3600);
        const minutes = Math.floor((time % 3600) / 60);
        return minutes > 0 ? `${hours}h ${minutes}m` : `${hours}h`;
    }
};

const formatTrainingTime = (time) => {
    if (!time || time === 0) return 'N/A';
    
    // Si c'est déjà une chaîne formatée (comme "2h 30m"), la retourner
    if (typeof time === 'string' && (time.includes('h') || time.includes('m') || time.includes('s'))) {
        return time;
    }
    
    // Sinon, formater comme une durée
    return formatDuration(time);
};

// Tests avec différentes valeurs
const testValues = [
    0,
    0.5,
    5.7,
    45.3,
    87.2,
    123.45,
    3600,
    3665,
    7200,
    7380,
    "123.45",
    "2h 30m",
    null,
    undefined
];

let resultsHTML = '<h2>Test Results:</h2>';
testValues.forEach(value => {
    const formatted = formatTrainingTime(value);
    resultsHTML += `<p><strong>Input:</strong> ${JSON.stringify(value)} → <strong>Output:</strong> ${formatted}</p>`;
});

document.getElementById('results').innerHTML = resultsHTML;
</script>
</body>
</html>
